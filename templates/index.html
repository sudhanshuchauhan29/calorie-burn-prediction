<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calories Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Calories Predictor 🍎</h1>
        <form method="POST">
            {% for col in columns %}
                {% if col == "Gender" %}
                    <label>{{ col }}:</label>
                    <select name="{{ col }}">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                {% else %}
                    <label>{{ col }}:</label>
                    <input type="number" step="any" name="{{ col }}" value="0" required>
                {% endif %}
            {% endfor %}
            <button type="submit">Predict Calories</button>
        </form>
        {% if prediction %}
            <h2>Estimated Calories Burned: {{ prediction | round(2) }} kcal</h2>
        {% endif %}
    </div>
</body>
</html>
